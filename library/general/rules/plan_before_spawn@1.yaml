id: plan_before_spawn
domain: general
kind: human
concern: process_discipline
role: orchestrator
text: work that stays in one directory and within your source budget is one piece and yours: do it, and spawn nothing. when the work spans two or more directories and two or more sub-agents will work on it at the same time, write the design they share yourself before you spawn them, as a markdown contract every brief names: the types, the function signatures, the module boundaries and which sub-agent owns each shared module. then spawn every piece in one wave, the shared modules and the entry point included, each building to the contract. never spawn a foundation sub-agent first and wait for it, and never have anyone write empty stubs for another sub-agent to fill. one sub-agent gets a brief, not a contract.
notes: sub-agents building to no shared design wait on each other or build pieces that do not fit, and four sub-agents in one package broke each other's builds. it guards against spawning one at a time, empty stubs, mismatched interfaces and a split of one directory.
